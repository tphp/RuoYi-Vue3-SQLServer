<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档查看</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: #fff; }

        .toolbar { padding: 8px 20px; border-bottom: 1px solid #e0e0e0; background: #fafafa; font-size: 13px; color: #666; display: flex; align-items: center; gap: 10px; }
        .toolbar .title { color: #333; font-weight: 600; }

        .content { max-width: 960px; margin: 0 auto; padding: 24px 32px 60px; line-height: 1.7; color: #333; font-size: 15px; }

        /* Markdown 渲染样式 */
        .content h1 { font-size: 26px; margin: 24px 0 16px; padding-bottom: 8px; border-bottom: 1px solid #eaecef; }
        .content h2 { font-size: 22px; margin: 22px 0 14px; padding-bottom: 6px; border-bottom: 1px solid #eaecef; }
        .content h3 { font-size: 18px; margin: 18px 0 12px; }
        .content h4 { font-size: 16px; margin: 14px 0 10px; }
        .content p { margin: 10px 0; }
        .content ul, .content ol { margin: 10px 0; padding-left: 28px; }
        .content li { margin: 4px 0; }
        .content a { color: #409eff; text-decoration: none; }
        .content a:hover { text-decoration: underline; }
        .content blockquote { margin: 12px 0; padding: 8px 16px; border-left: 4px solid #409eff; background: #f6f8fa; color: #555; }
        .content code { background: #f0f2f5; padding: 2px 6px; border-radius: 3px; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 13px; }
        .content pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow-x: auto; margin: 12px 0; }
        .content pre code { background: none; padding: 0; font-size: 13px; line-height: 1.5; }
        .content table { border-collapse: collapse; margin: 12px 0; width: 100%; }
        .content table th, .content table td { border: 1px solid #dfe2e5; padding: 8px 12px; text-align: left; }
        .content table th { background: #f6f8fa; font-weight: 600; }
        .content hr { border: none; border-top: 1px solid #eaecef; margin: 20px 0; }
        .content img { max-width: 100%; }

        .error { padding: 60px 20px; text-align: center; color: #f56c6c; font-size: 14px; }
    </style>
</head>
<body>
    <div class="toolbar">
        <span class="title" id="docTitle">文档</span>
        <span id="docPath" style="color:#999;"></span>
    </div>
    <div class="content" id="content">
        <div class="error">加载中...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script>
        // 从 URL 参数解析文档路径
        function getQueryParam(name) {
            var params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        var path = getQueryParam('path');
        var contentEl = document.getElementById('content');

        if (!path) {
            contentEl.innerHTML = '<div class="error">缺少文档路径参数</div>';
        } else {
            document.getElementById('docPath').textContent = path;
            // 标题取文件名
            var fileName = path.split('/').pop().replace(/\.md$/i, '');
            document.getElementById('docTitle').textContent = fileName;

            fetch('/docs/api/content?path=' + encodeURIComponent(path))
                .then(function(res) { return res.json(); })
                .then(function(json) {
                    if (json && json.code === 200) {
                        renderMarkdown(json.data || '');
                    } else {
                        contentEl.innerHTML = '<div class="error">' + (json && json.msg ? json.msg : '加载失败') + '</div>';
                    }
                })
                .catch(function(err) {
                    contentEl.innerHTML = '<div class="error">加载失败：' + err.message + '</div>';
                });
        }

        // 渲染 Markdown
        function renderMarkdown(text) {
            if (typeof marked === 'undefined') {
                // 兜底：CDN 加载失败时按纯文本展示
                contentEl.innerHTML = '<pre style="white-space:pre-wrap;word-break:break-word;">' + escapeHtml(text) + '</pre>';
                return;
            }
            marked.setOptions({ breaks: true, gfm: true });
            contentEl.innerHTML = marked.parse(text);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>
</html>
