<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; height: 100vh; overflow: hidden; }

        .layout { display: flex; height: 100vh; }

        /* 左侧导航（参考 doc/index.jsp 样式） */
        .sidebar { width: 300px; min-width: 300px; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; background: #fff; }
        .sidebar-header { padding: 14px 16px; border-bottom: 2px solid #1890ff; }
        .sidebar-header h1 { font-size: 18px; color: #1890ff; }
        .search-box { padding: 12px 12px 4px; position: relative; }
        .search-box input { width: 100%; padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 13px; outline: none; transition: border-color 0.2s; }
        .search-box input:focus { border-color: #1890ff; }

        .tree { flex: 1; overflow-y: auto; padding: 8px; }
        .tree ul { list-style: none; }
        .tree li { position: relative; }

        .node { display: flex; align-items: center; padding: 7px 10px; cursor: pointer; font-size: 13px; color: #333; user-select: none; text-decoration: none; border-left: 3px solid transparent; transition: background 0.2s, color 0.2s; }
        .node .arrow { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; margin-right: 2px; transition: transform 0.25s; flex-shrink: 0; }
        .node .arrow.open { transform: rotate(90deg); }
        .node .icon { margin-right: 8px; flex-shrink: 0; font-size: 15px; }
        .node .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* 根分组：圆角卡片，展开时浅蓝高亮 */
        .node-root { margin: 5px 0; padding: 11px 12px; background: #f6f8fa; border-radius: 6px; font-size: 14px; font-weight: 500; }
        .node-root:hover { background: #e6f7ff; }
        .node-root.opened { background: #e6f7ff; color: #1890ff; }

        /* 子级目录/文档：缩进纯文本，悬停与选中蓝色反馈 */
        .node-sub:hover { background: #f0f9ff; color: #1890ff; border-left-color: #1890ff; }
        .node-sub.active { background: #e6f7ff; color: #1890ff; border-left-color: #1890ff; font-weight: 500; }

        .children { display: none; }
        .children.expanded { display: block; }

        .empty { padding: 20px; text-align: center; color: #999; font-size: 13px; }

        /* 右侧内容 */
        .content { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .content iframe { flex: 1; border: none; width: 100%; }

        .welcome { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #999; }
        .welcome .big { font-size: 48px; margin-bottom: 12px; }
        .welcome p { font-size: 14px; }
    </style>
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>📚 技术文档中心</h1>
            </div>
            <div class="search-box">
                <input id="searchInput" type="text" placeholder="搜索文档..." />
            </div>
            <div class="tree" id="tree">
                <div class="empty">加载中...</div>
            </div>
        </div>
        <div class="content">
            <div class="welcome" id="welcome">
                <div class="big">📖</div>
                <p>请从左侧选择文档查看</p>
            </div>
            <iframe id="viewer" style="display:none;"></iframe>
        </div>
    </div>

    <script>
        // 全局树数据缓存，用于搜索
        var treeData = [];

        // 根分组图标映射（键为后端 DocRoot 显示名）
        var ROOT_ICONS = { '项目文档': '📚', '项目规则': '📋', 'AI 技能': '🤖' };

        // 加载文档树
        function loadTree() {
            fetch('/docs/api/tree')
                .then(function(res) { return res.json(); })
                .then(function(json) {
                    if (json && json.code === 200) {
                        treeData = json.data || [];
                        // 项目文档分组排序到最下方（项目规则、AI 技能置前）
                        treeData.sort(function(a, b) {
                            return (a.name === '项目文档' ? 1 : 0) - (b.name === '项目文档' ? 1 : 0);
                        });
                        renderTree(treeData);
                    } else {
                        renderEmpty('加载失败：' + (json && json.msg ? json.msg : '未知错误'));
                    }
                })
                .catch(function(err) {
                    renderEmpty('加载失败：' + err.message);
                });
        }

        // 渲染树
        function renderTree(nodes) {
            var container = document.getElementById('tree');
            if (!nodes || nodes.length === 0) {
                renderEmpty('暂无文档');
                return;
            }
            var ul = document.createElement('ul');
            nodes.forEach(function(node) { ul.appendChild(buildNode(node, 0)); });
            container.innerHTML = '';
            container.appendChild(ul);
        }

        // 构建节点（depth=0 根分组为卡片式并带图标，其余为缩进子级）
        function buildNode(node, depth) {
            depth = depth || 0;
            var li = document.createElement('li');

            var nodeEl = document.createElement('div');
            nodeEl.className = depth === 0 ? 'node node-root' : 'node node-sub';
            nodeEl.setAttribute('data-path', node.path || '');
            nodeEl.setAttribute('data-type', node.type || '');
            if (depth > 0) {
                // 子级按层级递增缩进
                nodeEl.style.paddingLeft = (10 + depth * 18) + 'px';
            }

            var label = document.createElement('span');
            label.className = 'label';
            label.textContent = node.name || '';
            label.setAttribute('title', node.name || '');

            if (node.type === 'dir') {
                var arrow = document.createElement('span');
                arrow.className = 'arrow';
                arrow.innerHTML = '▶';
                nodeEl.appendChild(arrow);
                if (depth === 0) {
                    // 根分组显示映射图标
                    var icon = document.createElement('span');
                    icon.className = 'icon';
                    icon.textContent = ROOT_ICONS[node.name] || '📁';
                    nodeEl.appendChild(icon);
                }
                nodeEl.appendChild(label);
            } else {
                // 文档项：纯文本，无图标
                nodeEl.appendChild(label);
            }

            nodeEl.addEventListener('click', function(e) {
                e.stopPropagation();
                if (node.type === 'dir') {
                    toggleChildren(nodeEl, li);
                } else {
                    openDoc(node.path, nodeEl);
                }
            });

            li.appendChild(nodeEl);

            if (node.children && node.children.length > 0) {
                var childrenUl = document.createElement('ul');
                childrenUl.className = 'children';
                node.children.forEach(function(child) {
                    childrenUl.appendChild(buildNode(child, depth + 1));
                });
                li.appendChild(childrenUl);
            }

            return li;
        }

        // 展开/收起目录（根分组展开时收起其他根分组，保持单项展开）
        function toggleChildren(nodeEl, li) {
            var arrow = nodeEl.querySelector('.arrow');
            var children = li.querySelector(':scope > .children');
            if (!children) return;
            var isOpen = children.classList.contains('expanded');
            if (isOpen) {
                children.classList.remove('expanded');
                arrow.classList.remove('open');
                nodeEl.classList.remove('opened');
            } else {
                // 展开根分组前先收起其他根分组
                if (nodeEl.classList.contains('node-root')) {
                    closeOtherRoots(li);
                }
                children.classList.add('expanded');
                arrow.classList.add('open');
                nodeEl.classList.add('opened');
            }
        }

        // 收起当前根分组以外的全部展开状态
        function closeOtherRoots(currentLi) {
            document.querySelectorAll('.children.expanded').forEach(function(c) {
                if (!currentLi.contains(c)) c.classList.remove('expanded');
            });
            document.querySelectorAll('.arrow.open').forEach(function(a) {
                if (!currentLi.contains(a)) a.classList.remove('open');
            });
            document.querySelectorAll('.node-root.opened').forEach(function(n) {
                if (!currentLi.contains(n)) n.classList.remove('opened');
            });
        }

        // 打开文档
        function openDoc(path, nodeEl) {
            // 高亮当前项
            var actives = document.querySelectorAll('.node.active');
            actives.forEach(function(a) { a.classList.remove('active'); });
            if (nodeEl) nodeEl.classList.add('active');

            var viewer = document.getElementById('viewer');
            var welcome = document.getElementById('welcome');
            viewer.src = '/docs/view.html?path=' + encodeURIComponent(path);
            viewer.style.display = 'block';
            welcome.style.display = 'none';
        }

        // 搜索过滤
        document.getElementById('searchInput').addEventListener('input', function(e) {
            var keyword = e.target.value.trim().toLowerCase();
            if (!keyword) {
                renderTree(treeData);
                return;
            }
            // 根据关键字过滤树，保留匹配的节点及其父节点
            var filtered = filterTree(treeData, keyword);
            renderTree(filtered);
            // 搜索时默认展开全部匹配结果的父级
            expandAll();
        });

        // 递归过滤树
        function filterTree(nodes, keyword) {
            var result = [];
            nodes.forEach(function(node) {
                // 显示名为中文名称，同时匹配路径（含英文文件名/目录名），保证中英文均可搜索
                var nameMatch = (node.name || '').toLowerCase().indexOf(keyword) !== -1
                    || (node.path || '').toLowerCase().indexOf(keyword) !== -1;
                if (node.type === 'dir') {
                    var filteredChildren = node.children ? filterTree(node.children, keyword) : [];
                    if (nameMatch || filteredChildren.length > 0) {
                        var clone = shallowClone(node);
                        clone.children = nameMatch ? (node.children || []) : filteredChildren;
                        result.push(clone);
                    }
                } else if (nameMatch) {
                    result.push(shallowClone(node));
                }
            });
            return result;
        }

        function shallowClone(node) {
            return { name: node.name, path: node.path, type: node.type, children: node.children ? [] : null };
        }

        // 搜索时展开所有目录
        function expandAll() {
            document.querySelectorAll('.children').forEach(function(c) {
                c.classList.add('expanded');
                // 根分组下的子列表展开时，同步根卡片高亮
                var root = c.parentNode ? c.parentNode.querySelector('.node-root') : null;
                if (root) root.classList.add('opened');
            });
            document.querySelectorAll('.arrow').forEach(function(a) {
                a.classList.add('open');
            });
        }

        function renderEmpty(msg) {
            var container = document.getElementById('tree');
            container.innerHTML = '<div class="empty">' + msg + '</div>';
        }

        // 初始化
        loadTree();
    </script>
</body>
</html>
